# xyterm's run-time settings (over the build-time config.rs, below X
# resources). Ctrl+Shift+R reloads this file. Keys: see project/config-file.md
# in the xyterm repository.
#
# Colors come from the shared X resource theme (*.color0..15, *foreground,
# *background; ~/.Xresources.d/theme), which overrides [colors] here.

font = "Iosevka XY Mono UI:size=10"

[colors]
# A copy of the X resource theme as loaded by xrdb (2026-11-22), so programs
# without an X display (xyterm-tui under mosh/ssh) get it too. X resources
# still override these in xyterm-gui.
foreground = "#3b3a47"
background = "#e0e0e0"
cursor = "#3b3a47"
palette = [
  "#262626", "#8d170f", "#598540", "#d29910",
  "#0f7793", "#f76bcb", "#4fa691", "#c0c0c0",
  "#404040", "#bb1f14", "#70a751", "#efb426",
  "#149cc1", "#fa9bdc", "#6ebaa8", "#f0f0f0",
]
